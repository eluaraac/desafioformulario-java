<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=], initial-scale=1.0"> 
    <link rel="stylesheet" href="style.css">
    <title>Média escolar</title>
</head>
<body>
    <h1 class="titulo">Média escolar</h1>
    <form id="formulario">
          <legend class="dados2"> Digite os dados do aluno: </legend>
          <br><br/>
            <label class="nome2" for="nome">Nome Completo:</label>
            <input type="text" id="nome" name="nome" maxlength="50" required>
            <br><br/>
            <label for="idade">Idade:</label>
            <input type="number" id="idade" name="idade" min="0" max="100" required>
            <br><br/>
            <legend class="dados">Digite as notas do aluno: </legend>
            <br><br>
            <label for="nota1">Nota 1:</label>
            <input type="number" min="0" max="10" id="nota1" name="nota1" required>
            <br><br/>
            <label for="nota2">Nota 2:</label>
            <input type="number" min="0" max="10" id="nota2" name="nota2" required>
            <br><br/>
            <label for="nota3">Nota 3:</label>
            <input type="number" min="0" max="10" id="nota3" name="nota3" required>
            <br><br/>
            <p></p>
            
            <p id= "mensagemErro"> </p>
            <p class = situacao1 id = "resultadoFinal"> Situação</p>
            
            <p id= "situacao"> </p>
            <p id= "media"> </p>
            <button type="submit" id = "calcular">Calcular média</button>
            <button type="reset">Limpar</button>

    </form>
    <script src="script.js"></script>
    
</body>
</html>
